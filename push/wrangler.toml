name = "mytask-push"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

[triggers]
crons = ["* * * * *"]

[vars]
VAPID_PUBLIC_KEY = "BD0-rc6SqlVCzJofoCmBhLqdqDyt2BZ6Y3lKDxBt2C1JQ5Qvcmz1HCwNKU6LLMLMJp0w-KycqqtBB9Lu4yrNXhk"
VAPID_SUBJECT = "https://silviocrescidev.github.io/mytask/"
# VAPID_PRIVATE_JWK è un secret: npx wrangler secret put VAPID_PRIVATE_JWK

# limite per indirizzo IP su /sync e /backup: 60 richieste al minuto bastano a un uso normale
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 60
  period = 60

[[d1_databases]]
binding = "DB"
database_name = "mytask-push"
database_id = "cf95968f-8ba3-4414-a623-9f733b2ad4b1"

[observability]
enabled = true
